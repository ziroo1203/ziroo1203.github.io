<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A letter for you</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#111a33;
      --card:#0f1730;
      --text:#eaf0ff;
      --muted:#a9b6e6;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Arial;
      color:var(--text);
      background: radial-gradient(1200px 700px at 20% 15%, #1a2a63 0%, transparent 60%),
                  radial-gradient(1000px 600px at 80% 30%, #5a2a7b 0%, transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{width:min(960px, 100%);}
    header{
      display:flex; align-items:flex-end; justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }
    h1{margin:0; font-size:22px; letter-spacing:.2px}
    .hint{color:var(--muted); font-size:13px}
    .stage{
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
    }
    /* 信封 */
    .envelopeArea{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:28px 10px;
      gap:14px;
    }
    .envelope{
      width:min(520px, 95%);
      aspect-ratio: 16/10;
      position:relative;
      cursor:pointer;
      transform: translateZ(0);
      filter: drop-shadow(0 16px 28px rgba(0,0,0,.35));
    }
    .env-body{
      position:absolute; inset:0;
      background: linear-gradient(180deg, #f5efe6, #eadfcc);
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.12);
      overflow:hidden;
    }
    .env-body:before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.8) 0%, transparent 55%),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,.55) 0%, transparent 60%);
      pointer-events:none;
      mix-blend-mode: soft-light;
    }
    .env-flap{
      position:absolute; left:0; right:0; top:0; height:55%;
      transform-origin: top center;
      background: linear-gradient(180deg, #efe5d7, #e2d2bb);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      border:1px solid rgba(0,0,0,.10);
      border-bottom:none;
      transition: transform 650ms cubic-bezier(.2,.9,.2,1);
      z-index:3;
    }
    .env-front{
      position:absolute; left:0; right:0; bottom:0; height:62%;
      background: linear-gradient(180deg, #f1e7d9, #eadfcc);
      clip-path: polygon(0 100%, 0 0, 50% 52%, 100% 0, 100% 100%);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      border:1px solid rgba(0,0,0,.10);
      border-top:none;
      z-index:4;
    }
    .env-label{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      z-index:5;
      pointer-events:none;
      padding:18px;
      text-align:center;
      color:#2b2b2b;
      font-weight:700;
      font-size: clamp(16px, 3.2vw, 26px);
      letter-spacing: 2px;
      text-shadow: 0 1px 0 rgba(255,255,255,.55);
    }
    .seal{
      position:absolute; left:50%; top:58%;
      transform:translate(-50%,-50%);
      width:64px; height:64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffb3c7, #d94163);
      box-shadow: 0 10px 18px rgba(0,0,0,.25);
      z-index:6;
      display:grid; place-items:center;
      color:#fff;
      font-weight:800;
      user-select:none;
    }
    .seal small{opacity:.9; font-size:14px; letter-spacing:.5px}
    .open .env-flap{ transform: rotateX(165deg); }
    /* 书本翻页修复 */
    .bookArea{ display:none; padding:10px; }
    .bookArea.show{ display:block; }
    .controls{
      display:flex; flex-wrap:wrap; gap:10px;
      align-items:center; justify-content:space-between;
      margin: 10px 0 12px;
    }
    .btns{display:flex; gap:10px; flex-wrap:wrap;}
    button{
      appearance:none;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:10px 14px;
      border-radius: 12px;
      cursor:pointer;
      font-size:14px;
    }
    button:disabled{opacity:.45; cursor:not-allowed}
    .meta{color:var(--muted); font-size:13px}
    .scene{
      perspective: 1400px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 0 18px;
    }
    .book{
      width:min(860px, 98%);
      aspect-ratio: 4/3;
      position:relative;
    }
    /* 修复：单层翻页卡片，去掉底层重复图片 */
    .flip-card{
      width:100%;
      height:100%;
      position:relative;
      transform-style: preserve-3d;
      transition: transform 900ms cubic-bezier(.2,.85,.2,1);
    }
    .flip-card.isFlipped{
      transform: rotateY(-180deg);
    }
    .card-face{
      position:absolute; inset:0;
      backface-visibility:hidden;
      border-radius:14px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background:#0b0f1e;
    }
    .card-back{
      transform: rotateY(180deg);
    }
    .card-face img{
      width:100%; height:100%;
      object-fit: contain;
      display:block;
    }
    .tapHint{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>A letter for you</h1>
        <p class="hint">先点信封打开，再翻页查看正反两面。</p>
      </div>
      <p class="hint">（建议用手机竖屏打开）</p>
    </header>
    <div class="stage">
      <!-- 信封模块 -->
      <div class="envelopeArea" id="envelopeArea">
        <div class="envelope" id="envelope" role="button" aria-label="Open envelope" tabindex="0">
          <div class="env-body"></div>
          <div class="env-flap"></div>
          <div class="env-front"></div>
          <div class="env-label">何奕梦亲启</div>
          <div class="seal" aria-hidden="true"><small>OPEN</small></div>
        </div>
        <p class="tapHint">点击信封开启</p>
      </div>
      <!-- 翻页模块（修复后单层结构） -->
      <div class="bookArea" id="bookArea">
        <div class="controls">
          <div class="btns">
            <button id="btnBackToEnvelope">返回信封</button>
            <button id="btnPrev" disabled>上一页</button>
            <button id="btnNext">下一页</button>
          </div>
          <div class="meta" id="pageMeta">第 1 / 2 页（正面）</div>
        </div>
        <div class="scene">
          <div class="book">
            <div class="flip-card" id="flipCard">
              <div class="card-face card-front">
                <img src="IMG_7893.jpeg" alt="信纸正面" />
              </div>
              <div class="card-face card-back">
                <img src="IMG_7892.jpeg" alt="信纸背面" />
              </div>
            </div>
          </div>
        </div>
        <p class="tapHint">点击“下一页/上一页”翻页（带翻页动画）</p>
      </div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const envelopeArea = document.getElementById('envelopeArea');
    const bookArea = document.getElementById('bookArea');
    const btnBackToEnvelope = document.getElementById('btnBackToEnvelope');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const flipCard = document.getElementById('flipCard');
    const pageMeta = document.getElementById('pageMeta');

    let page = 1; // 1正面，2背面

    function updateUI(){
      btnPrev.disabled = (page === 1);
      btnNext.disabled = (page === 2);
      if(page === 1){
        flipCard.classList.remove('isFlipped');
        pageMeta.textContent = '第 1 / 2 页（正面）';
      }else{
        flipCard.classList.add('isFlipped');
        pageMeta.textContent = '第 2 / 2 页（背面）';
      }
    }

    function openEnvelope(){
      envelope.classList.add('open');
      setTimeout(()=>{
        envelopeArea.style.display = 'none';
        bookArea.classList.add('show');
      }, 520);
    }

    function backToEnvelope(){
      page = 1;
      updateUI();
      bookArea.classList.remove('show');
      envelopeArea.style.display = 'flex';
      envelope.classList.remove('open');
    }

    envelope.addEventListener('click', openEnvelope);
    envelope.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' ') openEnvelope(); });
    btnBackToEnvelope.addEventListener('click', backToEnvelope);
    btnNext.addEventListener('click', ()=>{ page = 2; updateUI(); });
    btnPrev.addEventListener('click', ()=>{ page = 1; updateUI(); });

    updateUI();
  </script>
</body>
</html>
